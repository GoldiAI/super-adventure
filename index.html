<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סופר הרפתקה">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>סופר הרפתקה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a full-bleed canvas world, with toy-like chunky panels floating over it. One deliberate look (bright cartoon sky), so a single theme. */
:root{
  --ink:#2A2152; --ink-soft:#5E5492; --paper:#FFFDF6;
  --sun:#FFC93C; --sun-deep:#D9930B;
  --noam:#3DB7E9; --noam-deep:#1A86BF; --noam-tint:#D7F1FC;
  --yuval:#F0524A; --yuval-deep:#BE2E27; --yuval-tint:#FFE0DD;
  --mint:#3FCF8E; --mint-deep:#239A63;
  --lock:#B9B3D6; --dim:rgba(30,22,70,.55);
  --display:'Fredoka','Rubik','Arial Rounded MT Bold',Arial,sans-serif;
  --outline:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 7px 0 var(--ink);
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:#2A2152;color:var(--ink);font-family:var(--display);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}

.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2.6vh,22px);direction:rtl;text-align:center;overflow:auto;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.dim{background:var(--dim)}
.big-title{margin:0;font-weight:700;color:#fff;font-size:clamp(30px,8vh,68px);line-height:1.05;text-shadow:var(--outline);text-wrap:balance}
.sub{margin:0;font-weight:600;color:#fff;font-size:clamp(18px,4.2vh,30px);text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 4px 0 var(--ink)}
.hint{margin:0;font-weight:500;color:#fff;font-size:15px;opacity:.95;text-shadow:0 1px 0 var(--ink),0 2px 4px rgba(0,0,0,.4)}

.cards{display:flex;gap:clamp(14px,4vw,44px);flex-wrap:wrap;justify-content:center}
.card{appearance:none;border:0;cursor:pointer;font-family:inherit;background:var(--paper);border-radius:30px;padding:10px 10px 12px;
  width:clamp(130px,min(24vw,40vh),240px);display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 8px 0 var(--deep),0 16px 26px rgba(20,12,60,.35);transition:transform .12s ease,box-shadow .12s ease}
.card:hover{transform:translateY(-3px) rotate(-1deg)}
.card:active{transform:translateY(6px);box-shadow:0 2px 0 var(--deep),0 6px 12px rgba(20,12,60,.3)}
.card:focus-visible,.btn:focus-visible,.world:focus-visible,.iconbtn:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
.card canvas{width:100%;aspect-ratio:1/1;border-radius:22px;background:var(--tint);display:block}
.card .nm{font-size:clamp(26px,6vh,44px);font-weight:700;color:var(--deep);line-height:1}
.card .fr{font-size:clamp(13px,2.6vh,17px);font-weight:500;color:var(--ink-soft)}
.card.noam{--deep:var(--noam-deep);--tint:var(--noam-tint)}
.card.yuval{--deep:var(--yuval-deep);--tint:var(--yuval-tint)}

.maphead{display:flex;align-items:center;gap:14px;width:min(1000px,100%);justify-content:space-between}
.who{display:flex;align-items:center;gap:10px}
.who canvas{width:clamp(48px,11vh,72px);height:clamp(48px,11vh,72px);border-radius:50%;background:var(--paper);box-shadow:0 4px 0 var(--ink)}
.who h2{margin:0;color:#fff;font-size:clamp(22px,6vh,42px);font-weight:700;text-shadow:var(--outline)}
.worlds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2vw,18px);width:min(1000px,100%)}
@media (max-width:620px){.worlds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.world{appearance:none;border:0;cursor:pointer;font-family:inherit;background:var(--paper);border-radius:24px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;
  box-shadow:0 7px 0 #CFC6EE,0 14px 22px rgba(20,12,60,.3);transition:transform .12s ease,box-shadow .12s ease;position:relative;min-width:0}
.world:active{transform:translateY(5px);box-shadow:0 2px 0 #CFC6EE}
.world canvas{width:100%;aspect-ratio:16/10;border-radius:16px;display:block}
.world .wn{font-size:clamp(16px,3.6vh,22px);font-weight:700;color:var(--ink);line-height:1.1}
.world[disabled]{cursor:default}
.world[disabled] canvas{filter:grayscale(.85) brightness(.85)}
.world[disabled] .wn{color:var(--lock)}
.lockbadge{position:absolute;top:22%;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 var(--lock)}
.lockbadge svg{width:28px;height:28px;fill:var(--ink-soft)}
.stars{display:flex;gap:2px;justify-content:center;direction:ltr}
.stars svg{width:clamp(18px,4vh,24px);height:clamp(18px,4vh,24px);fill:#E4DEF5}
.stars svg.on{fill:var(--sun);filter:drop-shadow(0 2px 0 var(--sun-deep))}

.btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(18px,4.4vh,26px);padding:.5em 1.3em;border-radius:999px;
  background:var(--paper);color:var(--ink);box-shadow:0 6px 0 #CFC6EE,0 10px 18px rgba(20,12,60,.25);transition:transform .1s ease,box-shadow .1s ease}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #CFC6EE}
.btn.primary{background:var(--mint);color:#fff;box-shadow:0 6px 0 var(--mint-deep),0 10px 18px rgba(20,12,60,.25);text-shadow:0 2px 0 var(--mint-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--mint-deep)}
.btn.small{font-size:clamp(15px,3.4vh,19px);padding:.45em 1em}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.panel{background:var(--paper);border-radius:32px;padding:clamp(14px,3.5vh,28px) clamp(20px,4vw,40px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.2vh,16px);box-shadow:0 10px 0 #CFC6EE,0 20px 40px rgba(20,12,60,.35);max-width:100%}
.panel h2{margin:0;font-size:clamp(28px,7vh,50px);font-weight:700;color:var(--ink);line-height:1.05;text-wrap:balance}
.panel p{margin:0;font-size:clamp(17px,3.8vh,24px);font-weight:500;color:var(--ink-soft)}
.bigstars{display:flex;gap:8px;direction:ltr}
.bigstars svg{width:clamp(44px,11vh,72px);height:clamp(44px,11vh,72px);fill:#E4DEF5;transform:scale(.4);opacity:0}
.bigstars svg.show{animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.bigstars svg.on{fill:var(--sun);filter:drop-shadow(0 4px 0 var(--sun-deep))}
@keyframes pop{to{transform:scale(1);opacity:1}}

#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;direction:rtl;pointer-events:none;
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hg{display:flex;gap:8px;align-items:center}
.pill{background:rgba(255,253,246,.92);border-radius:999px;padding:4px 12px;display:flex;gap:5px;align-items:center;font-weight:700;font-size:22px;color:var(--ink);box-shadow:0 3px 0 rgba(42,33,82,.3);font-variant-numeric:tabular-nums;direction:ltr}
.pill svg{width:24px;height:24px}
.pill .st{fill:#DCD5F0}.pill .st.on{fill:var(--sun)}
.pill .hz{fill:#F4C9D3}.pill .hz.on{fill:#F0476A}
.iconbtn{pointer-events:auto;appearance:none;border:0;cursor:pointer;width:46px;height:46px;border-radius:50%;background:rgba(255,253,246,.92);box-shadow:0 3px 0 rgba(42,33,82,.3);display:grid;place-items:center;padding:0}
.iconbtn svg{width:24px;height:24px;fill:var(--ink)}
.iconbtn .waves{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.iconbtn.muted .waves{display:none}
.iconbtn .x{display:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.iconbtn.muted .x{display:inline}

#touch{position:fixed;inset:0;z-index:6;direction:ltr}
.tb{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.32);border:3px solid rgba(255,255,255,.8);display:grid;place-items:center;box-shadow:0 4px 0 rgba(42,33,82,.25);transition:transform .06s ease,background .06s ease}
.tb svg{width:42px;height:42px;fill:#fff;filter:drop-shadow(0 2px 0 rgba(42,33,82,.45))}
#bL{left:max(18px,env(safe-area-inset-left,0px))}
#bR{left:calc(max(18px,env(safe-area-inset-left,0px)) + 104px)}
#bJ{right:max(22px,env(safe-area-inset-right,0px));width:112px;height:112px}
#bJ svg{width:54px;height:54px}
.tb.on{background:rgba(255,255,255,.7);transform:scale(.93)}
#bJ.nudge{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.12);background:rgba(255,230,120,.65)}}

#banner{position:fixed;left:0;right:0;top:20%;z-index:12;text-align:center;font-weight:700;color:#fff;font-size:clamp(36px,10vh,78px);text-shadow:var(--outline);pointer-events:none;direction:rtl;animation:ban 2.4s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(.5)}14%{opacity:1;transform:scale(1.1)}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 8px);width:max-content;max-width:min(52vw,520px);z-index:12;background:rgba(255,253,246,.95);color:var(--ink);font-weight:600;font-size:17px;padding:8px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(42,33,82,.3);direction:rtl;pointer-events:none;text-align:center;line-height:1.3;border-radius:22px}
.quiz{gap:clamp(6px,1.8vh,14px);padding-block:clamp(10px,2.6vh,22px)}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .iconbtn{background:var(--sun);box-shadow:0 3px 0 var(--sun-deep)}
.quiz h2{font-size:clamp(24px,6vh,40px)}
#qBig{font-size:clamp(34px,10vh,64px);font-weight:700;color:var(--noam-deep);letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
#qVis{width:min(70vw,420px);height:auto;aspect-ratio:16/5;display:block}
.qopts{display:flex;gap:clamp(10px,3vw,22px);justify-content:center;direction:ltr}
.qopt{appearance:none;border:0;cursor:pointer;font-family:inherit;width:clamp(78px,min(22vw,24vh),130px);aspect-ratio:1/1;border-radius:24px;background:#F3EFFC;
  box-shadow:0 6px 0 #CFC6EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;transition:transform .1s ease,opacity .3s ease}
.qopt:active{transform:translateY(4px);box-shadow:0 2px 0 #CFC6EE}
.qopt:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.qopt canvas{width:100%;height:100%;display:block}
.qtxt{font-size:clamp(30px,8vh,52px);font-weight:700;color:var(--ink);line-height:1}
.qsub{font-size:clamp(13px,2.6vh,17px);font-weight:600;color:var(--ink-soft)}
.qopt.right{background:#C9F5DE;box-shadow:0 6px 0 var(--mint-deep);animation:right .5s ease}
.qopt.wrong{opacity:.35;animation:shake .35s ease}
.qopt.hint{animation:hintp 1s ease-in-out infinite}
@keyframes right{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes hintp{50%{transform:scale(1.08);box-shadow:0 6px 0 var(--sun-deep),0 0 0 6px rgba(255,201,60,.6)}}
.ball{width:clamp(38px,9vh,56px);height:clamp(38px,9vh,56px)}
.panel .cheer{margin:0;font-size:clamp(20px,5vh,30px);font-weight:700;color:var(--yuval-deep)}
.pill.bump{animation:hudbump .3s ease}
@keyframes hudbump{40%{transform:scale(1.18)}}
.screen{animation:fadein .28s ease}
.screen .panel{animation:panelin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes fadein{from{opacity:0}}
@keyframes panelin{from{transform:scale(.85);opacity:0}}
@media (orientation: portrait){#toast{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 132px);max-width:calc(100vw - 40px)}}
@media (prefers-reduced-motion: reduce){#banner{animation-duration:.01s}.card,.btn,.world{transition:none}#bJ.nudge{animation:none}}
</style>

<canvas id="game" aria-label="מסך המשחק"></canvas>

<div id="touch" hidden>
  <div class="tb" id="bL" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M28 7 L9 20 L28 33 Z" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></div>
  <div class="tb" id="bR" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M12 7 L31 20 L12 33 Z" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></div>
  <div class="tb" id="bJ" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 5 L35 22 H26 V34 H14 V22 H5 Z" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>
</div>

<div id="hud" hidden>
  <div class="hg">
    <div class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#E8A10F"/><circle cx="12" cy="12" r="7.5" fill="#FFD43B"/><rect x="10.6" y="7" width="2.8" height="10" rx="1.4" fill="#E8A10F"/></svg><span id="coinN">0</span></div>
    <div class="pill" id="starPill"></div>
    <div class="pill" id="heartPill"></div>
  </div>
  <div class="hg">
    <button class="iconbtn" id="pauseBtn" aria-label="הפסקה"><svg viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.6"/><rect x="14" y="4" width="4.5" height="16" rx="1.6"/></svg></button>
    <button class="iconbtn" id="muteBtn" aria-label="צלילים"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="M15.5 9l6 6M21.5 9l-6 6"/></svg></button>
  </div>
</div>

<div id="banner" hidden></div>
<div id="toast" hidden></div>

<section id="sTitle" class="screen">
  <h1 class="big-title">ההרפתקה של נועם ויובל</h1>
  <p class="sub">מי משחק עכשיו?</p>
  <div class="cards">
    <button class="card noam" id="pickNoam"><canvas id="cvNoam" width="240" height="240"></canvas><span class="nm">נועם</span><span class="fr">עם בלובי החייזר</span></button>
    <button class="card yuval" id="pickYuval"><canvas id="cvYuval" width="240" height="240"></canvas><span class="nm">יובל</span><span class="fr">עם ספיידי העכביש</span></button>
  </div>
  <p class="hint" id="keyHint">במחשב: החצים כדי לזוז, רווח כדי לקפוץ</p>
</section>

<section id="sMap" class="screen" hidden>
  <div class="maphead">
    <div class="who"><canvas id="cvWho" width="144" height="144"></canvas><h2 id="mapTitle">העולמות של נועם</h2></div>
    <button class="btn small" id="swapBtn">החלפת שחקן</button>
  </div>
  <div class="worlds" id="worlds"></div>
</section>

<section id="sPause" class="screen dim" hidden>
  <div class="panel">
    <h2>הפסקה</h2>
    <button class="btn primary" id="resumeBtn">להמשיך לשחק</button>
    <div class="row"><button class="btn small" id="restartBtn">מההתחלה</button><button class="btn small" id="pauseMapBtn">למפה</button></div>
  </div>
</section>

<section id="sQuiz" class="screen dim" hidden>
  <div class="panel quiz">
    <div class="qtop"><h2 id="qPrompt">כמה זה?</h2><button class="iconbtn" id="qSay" aria-label="להשמיע שוב"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
    <div id="qBig" dir="ltr"></div>
    <canvas id="qVis" width="640" height="200"></canvas>
    <div class="qopts" id="qOpts"></div>
  </div>
</section>
<audio id="winSong" preload="none"></audio>

<section id="sWin" class="screen dim" hidden>
  <div class="panel">
    <svg class="ball" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#F28C28" stroke="#2A2152" stroke-width="2.5"/><path d="M3 24h42M24 3v42M9 9c8 6 8 24 0 30M39 9c-8 6-8 24 0 30" fill="none" stroke="#2A2152" stroke-width="2.5"/></svg>
    <p class="cheer">יאללה הפועל!</p>
    <h2 id="winTitle">כל הכבוד!</h2>
    <div class="bigstars" id="winStars"></div>
    <p id="winCoins"></p>
    <div class="row"><button class="btn primary" id="nextBtn">לעולם הבא</button><button class="btn small" id="winMapBtn">למפה</button></div>
  </div>
</section>

<script>
'use strict';
/* ============ basics ============ */
const T=48, ROWS=12, VH=ROWS*T;
const $=s=>document.querySelector(s);
const cv=$('#game'), ctx=cv.getContext('2d');
let c=ctx;
let dpr=1, scale=1, VW=1000, VHV=VH, offY=0, portrait=false, cssW=0, cssH=0;
const coarse=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
const STAR_SVG='<svg viewBox="0 0 24 24" class="st"><path d="M12 1.8l3 6.5 7.1.8-5.3 4.8 1.5 7L12 17.4l-6.3 3.5 1.5-7L1.9 9.1 9 8.3z"/></svg>';
const HEART_SVG='<svg viewBox="0 0 24 24" class="hz"><path d="M12 21.2s-8-4.8-10-9.6C.6 8 2.8 4.4 6.4 4.4c2.2 0 3.7 1.2 4.6 2.6l1 1.4 1-1.4c.9-1.4 2.4-2.6 4.6-2.6 3.6 0 5.8 3.6 4.4 7.2-2 4.8-10 9.6-10 9.6z"/></svg>';
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function clamp(v,a,b){return v<a?a:v>b?b:v}

/* ============ save ============ */
const SAVE_KEY='noam-yuval-adventure-v1';
let save={noam:{open:1,stars:[0,0,0,0]},yuval:{open:1,stars:[0,0,0,0]},muted:false};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&s.noam&&s.yuval)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* ============ audio ============ */
let AC=null, master=null, musicBus=null, musicTimer=null, song=null, mStep=0, mNext=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=save.muted?0:0.9;master.connect(AC.destination);
    musicBus=AC.createGain();musicBus.gain.value=0.32;musicBus.connect(master)}catch(e){AC=null}
}
function tone(f,d,type,vol,slide,delay,bus){
  if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(bus||master);o.start(t);o.stop(t+d+0.05);
}

function schedMusic(){
  if(!AC||!song)return;const spb=60/song.bpm/2;
  while(mNext<AC.currentTime+0.25){
    const n=song.lead[mStep%song.lead.length], b=song.bass[mStep%song.bass.length];

function moveX(o){
  o.hitWall=0;o.x+=o.vx;const t0=Math.floor((o.y+2)/T),t1=Math.floor((o.y+o.h-2)/T);
  if(o.vx>0){const tx=Math.floor((o.x+o.w)/T);for(let ty=t0;ty<=t1;ty++)if(isSolid(tileAt(tx,ty))){o.x=tx*T-o.w-0.01;o.vx=0;o.hitWall=1;return}}

}
function collideY(o,prevBottom,isP){

  else if(o.vy<0){const ty=Math.floor(o.y/T);let best=null,bd=1e9;for(let tx=l;tx<=r;tx++){if(isSolid(tileAt(tx,ty))){const d=Math.abs(tx*T+T/2-(o.x+o.w/2));if(d<bd){bd=d;best=tx}}}
    if(best!==null){o.y=(ty+1)*T;o.vy=0.5;if(isP)bumpTile(best,ty)}}
}
function bumpTile(tx,ty){

  if(ch==='?'){G.L.t[ty][tx]='U';G.coins++;SFX.coin();addP({k:'coin',x:tx*T+T/2,y:ty*T,vy:-7,life:28,max:28});hud()}
  else if(ch==='*'){G.L.t[ty][tx]='U';G.ents.push({t:'star',x:tx*T+T/2,y:ty*T+T/2,r:22,rise:32});tone(523,0.12,'triangle',0.12);tone(784,0.2,'triangle',0.12,null,0.1)}

}
function stepPlayer(p){

function circleRect(x,y,r,o){const nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);return (x-nx)*(x-nx)+(y-ny)*(y-ny)<r*r}

function dust(x,y,nn){for(let i=0;i<nn;i++)addP({k:'dust',x:x+(Math.random()-.5)*20,y:y-3,vx:(Math.random()-.5)*2,vy:-Math.random()*1.2,life:22,max:22,size:4+Math.random()*4})}
function confetti(nn){const cols=['#FF6B81','#FFD43B','#4DABF7','#69DB7C','#DA77F2','#FF922B'];for(let i=0;i<nn;i++)addP({k:'conf',x:G.cam+Math.random()*VW,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:1.5+Math.random()*2.5,rot:Math.random()*6,vr:(Math.random()-.5)*0.3,life:260,max:260,col:cols[i%6],size:5+Math.random()*4})}
function popText(t,x,y,col){addP({k:'text',t,x,y,vx:0,vy:-1.1,life:55,max:55,col})}
function butterfly(x,y){const cols=['#FF8FC7','#FFD43B','#8EC1FF','#B197FC'];addP({k:'fly',x,y,vx:(Math.random()-.5)*1.4,vy:-1.3,life:130,max:130,col:cols[Math.floor(Math.random()*4)],ph:Math.random()*6})}
function stepParticles(){
  const ps=G.parts;for(let i=ps.length-1;i>=0;i--){const q=ps[i];q.x+=q.vx||0;q.y+=q.vy||0;
    if(q.k==='spark')q.vy+=0.18;else if(q.k==='coin')q.vy+=0.45;else if(q.k==='conf'){q.rot+=q.vr;q.x+=Math.sin((q.life+q.size)*0.08)*0.8}else if(q.k==='fly'){q.x+=Math.sin(q.life*0.1+q.ph)*1.2}else if(q.k==='dust'){q.size+=0.2}

}
function drawParticles(){
  for(const q of G.parts){const a=clamp(q.life/q.max,0,1);
    if(q.k==='spark'){c.globalAlpha=a;c.fillStyle=q.col;if(q.star){starPath(q.x,q.y,q.size*1.6,q.size*0.7,q.life*0.2);c.fill()}else{circ(q.x,q.y,q.size*a+0.5);c.fill()}}
    else if(q.k==='dust'){c.globalAlpha=a*0.7;c.fillStyle='#FFFFFF';circ(q.x,q.y,q.size);c.fill()}
    else if(q.k==='coin'){c.globalAlpha=a;const s=Math.abs(Math.cos(q.life*0.4));c.fillStyle='#E8A10F';ell(q.x,q.y,13*s+1,13);c.fill();c.fillStyle='#FFD43B';ell(q.x,q.y,10*s+0.5,10);c.fill()}
    else if(q.k==='conf'){c.globalAlpha=Math.min(1,a*3);c.save();c.translate(q.x,q.y);c.rotate(q.rot);c.fillStyle=q.col;c.fillRect(-q.size/2,-q.size/4,q.size,q.size/2);c.restore()}
    else if(q.k==='text'){c.globalAlpha=Math.min(1,a*2);outlineText(q.t,q.x,q.y,24,q.col)}
    else if(q.k==='fly'){c.globalAlpha=Math.min(1,a*2);const f=Math.abs(Math.sin(q.life*0.4));c.fillStyle=q.col;ell(q.x-5*f,q.y,6*f+1,7,-0.3);c.fill();ell(q.x+5*f,q.y,6*f+1,7,0.3);c.fill();c.fillStyle='#2A2152';rr(q.x-1.2,q.y-6,2.4,12,1.2);c.fill()}
  }

}

function bigMath(lv){
  const r=rint,k=Math.random();let t;

  else if(lv===1){if(k<0.35){const a=r(25,75);t=[a,'+',r(15,100-a)]}else if(k<0.65){const a=r(50,100);t=[a,'-',r(12,a-8)]}else t=[r(10,35),'+',r(10,35),'+',r(10,30)]}
  else if(lv===2){if(k<0.4)t=[r(15,45),'+',r(15,45),'+',r(15,45)];else if(k<0.75){const a=r(30,70),b=r(10,40);t=[a,'+',b,'-',r(10,a+b-8)]}else{const a=r(100,150);t=[a,'-',r(20,80)]}}
  else{if(k<0.3)t=[r(10,40),'+',r(10,40),'+',r(10,40),'+',r(10,40)];else if(k<0.65){const a=r(60,120),b=r(20,80);t=[a,'+',b,'-',r(15,a+b-10)]}else{const a=r(120,200),b=r(20,60);t=[a,'-',b,'-',r(10,a-b-10)]}}
  let ans=t[0];for(let i=1;i<t.length;i+=2)ans=t[i]==='+'?ans+t[i+1]:ans-t[i+1];
  return{text:t.join(' ')+' = ?',ans};
}

  [523,659,784,1047].forEach((f,i)=>tone(f,0.3,'square',0.07,null,0.3+i*0.12));
  [784,784,880,784,1047].forEach((f,i)=>tone(f,0.25,'square',0.06,null,1.9+i*0.17));
  setTimeout(()=>say([['יאללה הפועל!','he']]),500);
}

/* ============ speech ============ */
let voices=[];function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}
try{loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}
function say(parts){
  try{if(save.muted||!window.speechSynthesis||!parts||!parts.length)return;const ss=speechSynthesis;ss.cancel();
    for(const [text,l] of parts){const lang=l==='en'?'en-US':'he-IL';const v=voices.find(x=>x.lang===lang)||voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(l==='en'?'en':'he'));
      if(l==='he'&&!v&&voices.length)continue;const u=new SpeechSynthesisUtterance(text);u.lang=lang;if(v)u.voice=v;u.rate=l==='en'?0.8:0.95;u.pitch=1.1;ss.speak(u)}}catch(e){}
}

/* ============ screens ============ */
const screens=['#sTitle','#sMap','#sPause','#sWin','#sQuiz'];
function showScreen(id){for(const s of screens)$(s).hidden=(s!==id)}
function goTitle(){state='title';G=null;stopMusic();showScreen('#sTitle');$('#hud').hidden=true;$('#touch').hidden=true;menuWorld=0}
function goMap(){
  state='map';G=null;stopMusic();showScreen('#sMap');$('#hud').hidden=true;$('#touch').hidden=true;
  const s=save[kid];$('#mapTitle').textContent=kid==='noam'?'העולמות של נועם':'העולמות של יובל';
  menuWorld=Math.min(s.open-1,3);
  const box=$('#worlds');box.innerHTML='';
  WORLDS.forEach((W,i)=>{
    const b=document.createElement('button');b.className='world';b.id='world'+i;const locked=i>=s.open;if(locked)b.disabled=true;
    b.innerHTML='<canvas></canvas><span class="wn">'+W.name+'</span><span class="stars">'+[0,1,2].map(k=>STAR_SVG.replace('class="st"','class="st'+(k<(s.stars[i]||0)?' on':'')+'"')).join('')+'</span>'+(locked?'<span class="lockbadge"><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1.5A1.5 1.5 0 0 1 20 11.5v8A1.5 1.5 0 0 1 18.5 21h-13A1.5 1.5 0 0 1 4 19.5v-8A1.5 1.5 0 0 1 5.5 10zm2.5 0h5V7a2.5 2.5 0 0 0-5 0z"/></svg></span>':'');
    b.addEventListener('click',()=>{if(locked)return;SFX.click();startLevel(i)});
    box.appendChild(b);
  });
  requestAnimationFrame(()=>{box.querySelectorAll('canvas').forEach((cc,i)=>drawThumb(cc,i))});
}
function showWin(){
  if(!G)return;state='win';showScreen('#sWin');
  const name=kid==='noam'?'נועם':'יובל';const last=G.wi===3;
  $('#winTitle').textContent=last?'ניצחת את כל העולמות!':'כל הכבוד, '+name+'!';
  $('#winCoins').textContent='אספת '+G.coins+' מטבעות ופתרת '+(G.learned||0)+' חידות';
  const st=$('#winStars');st.innerHTML=[0,1,2].map(k=>STAR_SVG.replace('class="st"','class="st'+(k<G.stars?' on':'')+'"')).join('');
  [...st.children].forEach((el,i)=>setTimeout(()=>{el.classList.add('show');if(i<G.stars)tone(660+i*220,0.18,'triangle',0.12)},300+i*350));
  $('#nextBtn').hidden=last;$('#nextBtn').textContent='לעולם הבא';
}
let toastT=null;
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3800)}
function banner(text){const el=$('#banner');el.hidden=true;el.textContent=text;void el.offsetWidth;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2500)}
let hudCache={};
function hud(){
  if(!G)return;
  const bump=el=>{el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')};
  if(hudCache.coins!==G.coins){$('#coinN').textContent=G.coins;if(hudCache.coins!=null)bump($('#coinN').parentNode);hudCache.coins=G.coins}
  if(hudCache.stars!==G.stars&&hudCache.stars!=null)bump($('#starPill'));
  if(hudCache.stars!==G.stars){$('#starPill').innerHTML=[0,1,2].map(k=>STAR_SVG.replace('class="st"','class="st'+(k<G.stars?' on':'')+'"')).join('');hudCache.stars=G.stars}
  if(hudCache.hearts!==G.hearts){$('#heartPill').innerHTML=[0,1,2].map(k=>HEART_SVG.replace('class="hz"','class="hz'+(k<G.hearts?' on':'')+'"')).join('');hudCache.hearts=G.hearts}
}
function pauseGame(){if(state!=='play')return;state='pause';showScreen('#sPause');stopMusic()}
function resumeGame(){if(state!=='pause')return;showScreen(null);state='play';for(const k in keys)keys[k]=false;touch.L=touch.R=touch.J=false;audioInit();startMusic(G.wi)}
let wakeLock=null;
async function requestWake(){try{if(navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}

/* ============ input ============ */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',Space:'jump',KeyZ:'jump',KeyX:'jump'};
addEventListener('keydown',e=>{
  if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){if(state==='play')pauseGame();else if(state==='pause')resumeGame();return}
  const k=KEYMAP[e.code];if(!k)return;if(state==='play')e.preventDefault();
  if((k==='jump'||k==='up')&&!keys.jump&&!keys.up&&!e.repeat)jumpPressed=true;
  if(k==='up'){keys.up=true;keys.jump=true}else keys[k]=true;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(!k)return;if(k==='up'){keys.up=false;keys.jump=false}else keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const TB={L:$('#bL'),R:$('#bR'),J:$('#bJ')};
function touchScan(e){
  if(state!=='play')return;e.preventDefault();
  let L=false,R=false,J=false;const rects={};for(const k in TB)rects[k]=TB[k].getBoundingClientRect();
  for(const tc of e.touches){const x=tc.clientX,y=tc.clientY;
    const inR=(r,pad)=>x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;
    if(inR(rects.J,28)||x>cssW*0.62&&y>cssH*0.35)J=true;
    else if(inR(rects.L,14))L=true;else if(inR(rects.R,14))R=true;
    else if(x<cssW*0.45&&y>cssH*0.35){const mid=(rects.L.right+rects.R.left)/2;if(x<mid)L=true;else R=true}
  }
  if(J&&!touch.J)jumpPressed=true;
  touch.L=L;touch.R=R;touch.J=J;TB.L.classList.toggle('on',L);TB.R.classList.toggle('on',R);TB.J.classList.toggle('on',J);
}
const tl=$('#touch');['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>tl.addEventListener(ev,touchScan,{passive:false}));

/* ============ buttons ============ */
function pick(who){kid=who;audioInit();SFX.click();
  if(coarse){try{const de=document.documentElement;if(de.requestFullscreen&&!document.fullscreenElement)de.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}catch(e){}}
  goMap()}
$('#pickNoam').addEventListener('click',()=>pick('noam'));
$('#pickYuval').addEventListener('click',()=>pick('yuval'));
$('#swapBtn').addEventListener('click',()=>{SFX.click();goTitle()});
$('#pauseBtn').addEventListener('click',()=>{SFX.click();pauseGame()});
$('#muteBtn').addEventListener('click',()=>{audioInit();setMuted(!save.muted);SFX.click()});
$('#resumeBtn').addEventListener('click',()=>{SFX.click();resumeGame()});
$('#restartBtn').addEventListener('click',()=>{SFX.click();startLevel(G.wi)});
$('#pauseMapBtn').addEventListener('click',()=>{SFX.click();goMap()});
$('#nextBtn').addEventListener('click',()=>{SFX.click();startLevel(Math.min(3,G.wi+1))});
$('#winMapBtn').addEventListener('click',()=>{SFX.click();goMap()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')pauseGame();stopMusic()}});
$('#keyHint').hidden=coarse;
setMuted(save.muted);

/* ============ sizing & loop ============ */
function resize(){
  cssW=innerWidth;cssH=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  portrait=cssH>cssW*1.05;
  const rows=cssH<560?9.2:cssH<760?10.5:12;
  scale=Math.min(cssH/(rows*T),cssW/(T*11));VW=cssW/scale;VHV=Math.min(VH,cssH/scale);
  offY=portrait?Math.max(0,(cssH-VH*scale)*0.3):0;
  if(state==='map')$('#worlds').querySelectorAll('canvas').forEach((cc,i)=>drawThumb(cc,i));
}
addEventListener('resize',resize);resize();
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-last;last=now;if(dt>100)dt=100;
  if(!cssW||!cssH){if(innerWidth&&innerHeight)resize();return}
  if(G&&(state==='play'||state==='win')){acc+=dt;let n=0;while(acc>=STEP&&n<4){step();acc-=STEP;n++}if(n===4)acc=0}else acc=0;
  if(G)render();else{renderMenuBG(now);if(state==='title'){drawCard($('#cvNoam'),'noam',now/16);drawCard($('#cvYuval'),'yuval',now/16)}else if(state==='map'){const w=$('#cvWho');drawCard(w,kid,now/16)}}
}
requestAnimationFrame(frame);
</script>
